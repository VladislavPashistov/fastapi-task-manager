[project]
name = "app"
version = "0.1.0"
description = ""
authors = [{ name = "Владислав", email = "hh61803222@gmail.com" }]
requires-python = ">=3.11,<4.0"

dependencies = [
  "fastapi>=0.128.0",
  "uvicorn[standard]>=0.40.0",
  "sqlalchemy>=2.0.46",
  "alembic>=1.18.3",
  "asyncpg",
  "psycopg[binary,pool] (>=3.3.2,<4.0.0)",
  "pydantic-settings",
  "python-dotenv",
  "passlib[bcrypt,argon2]",
  "python-jose[cryptography]",
  "celery",
  "redis",
  "email-validator",
  "python-multipart>=0.0.22"
]

[tool.poetry]
package-mode = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:Accessing argon2\\.__version__ is deprecated and will be removed:DeprecationWarning",
    "ignore:transaction already deassociated from connection:sqlalchemy.exc.SAWarning",
]
