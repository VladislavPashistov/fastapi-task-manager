apiVersion: 1
groups:
    - orgId: 1
      name: defoult
      folder: todoList
      interval: 5m
      rules:
        - uid: efdx5dg1m3jlsc
          title: Backend 5xx rate
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: PBFA97CFB590B2093
              model:
                editorMode: code
                expr: "100 *\r\n(\r\n  sum(rate(http_requests_total{handler!~\"/(openapi.json|health|metrics)\", status=~\"5..\"}[5m]))\r\n/ \r\n  sum(rate(http_requests_total{handler!~\"/(openapi.json|health|metrics)\"}[5m])))\r\n> 3\r\nand\r\nsum(rate(http_requests_total{handler!~\"/(openapi.json|health|metrics)\"}[5m])) > 0.2"
                instant: true
                interval: ""
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: OK
          for: 5m
          annotations:
            description: Backend 5xx rate > 3% for 5 minutes
            summary: Backend 5xx rate > 3% for 5 minutes
          isPaused: false
          notification_settings:
            receiver: telega
        - uid: efdxaeytx2ccge
          title: slowly latency
          condition: C
