global:
  scrape_interval: 3s

scrape_configs:
  - job_name: "litestar"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend_one:8000", "backend_two:8000"]
  - job_name: "scraping"
    metrics_path: /metrics
    static_configs:
      - targets: ["cadvisor:8080"]
      - targets: ["postgres_exporter:9187"]
      - targets: ["rabbitmq_exporter:9419"]