services:
  backend_one:
    build: .
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./app:/app/app
    environment:
      DATABASE_URL_ASYNC: postgresql+asyncpg://app:pass@db_dev:5432/app_db
    depends_on:
      db_dev:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 20s
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]


  backend_two:
    build: .
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./app:/app/app
    environment:
      DATABASE_URL_ASYNC: postgresql+asyncpg://app:pass@db_dev:5432/app_db
    depends_on:
      db_dev:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 20s
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000" ]


  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend_one:
        condition: service_healthy
      backend_two:
        condition: service_healthy
    restart: unless-stopped


  db_dev:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: app_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app -d app_db" ]
      interval: 5s
      timeout: 5s
      retries: 3


  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: pass
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 20s


  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 3


  celery_worker:
    build: .
    command: ["celery","-A","app.core.celery_app","worker","-l","info"]
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      db_dev:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "ps aux | grep -q '[c]elery.*worker' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3


  celery_beat:
    build: .
    command: ["celery", "-A", "app.core.celery_app", "beat", "-l", "info", "--schedule", "/var/lib/celery/celerybeat-schedule"]
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      db_dev:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - celery_beat_data:/var/lib/celery
    healthcheck:
      test: [ "CMD-SHELL", "pgrep -f 'celery.*beat' >/dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3


volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  celery_beat_data: