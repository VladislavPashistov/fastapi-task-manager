services:
  backend_one:
    build: .
    container_name: backend_one
    mem_limit: 512m
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./app:/app/app
    environment:
      DATABASE_URL_ASYNC_INNER: postgresql+asyncpg://app:pass@database:5432/app_db
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 20s
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]


  backend_two:
    build: .
    container_name: backend_two
    mem_limit: 512m
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./app:/app/app
    environment:
      DATABASE_URL_ASYNC_INNER: postgresql+asyncpg://app:pass@database:5432/app_db
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 20s
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000" ]


  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend_one:
        condition: service_healthy
      backend_two:
        condition: service_healthy
    restart: unless-stopped


  database:
    image: postgres:17
    container_name: database
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: app_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app -d app_db" ]
      interval: 5s
      timeout: 5s
      retries: 3


  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: pass
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 20s


  redis:
    image: redis:7-alpine
    container_name: redis
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 3


  celery_worker:
    build: .
    container_name: celery_worker
    command: ["celery","-A","app.core.celery_app","worker","-l","info"]
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "ps aux | grep -q '[c]elery.*worker' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3


  celery_beat:
    build: .
    container_name: celery_beat
    command: ["celery", "-A", "app.core.celery_app", "beat", "-l", "info", "--schedule", "/var/lib/celery/celerybeat-schedule"]
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - celery_beat_data:/var/lib/celery
    healthcheck:
      test: [ "CMD-SHELL", "pgrep -f 'celery.*beat' >/dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3


# mount loging
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./grafana/promtail-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    privileged: true

  loki:
    image: grafana/loki:latest
    container_name: loki
    volumes:
      - ./grafana/loki-config.yaml:/etc/loki/local-config.yaml

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./grafana/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheusdata:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      # datasources provisioning (сам подхватит)
      - ./grafana/provisioning/datasources/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      # dashboards provisioning YAML
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      # сами JSON дашборды
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

      - grafanadata:/var/lib/grafana


# for scrap
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - default

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter
    container_name: postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://app:pass@database:5432/app_db?sslmode=disable"
    depends_on:
      database:
        condition: service_healthy

  rabbitmq_exporter:
    image: kbudde/rabbitmq-exporter:latest
    container_name: rabbitmq_exporter
    environment:
      RABBIT_URL: http://rabbitmq:15672
      RABBIT_USER: app
      RABBIT_PASSWORD: pass
    depends_on:
      rabbitmq:
        condition: service_healthy


volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  celery_beat_data:
  grafanadata:
  prometheusdata: